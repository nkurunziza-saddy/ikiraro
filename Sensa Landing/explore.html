      /* ===== One reusable artboard body. Same content in every option ===== */
      function HeroBoard({ optionClass, title, paletteName, fonts, palette }) {

                <a>Customers</a>
                <a>Pricing</a>

              <a className="nav-cta">Open dashboard</a>
            </div>

            <div className="opt-hero">
              <div className="opt-eyebrow">
                <span className="ln"></span>
                <span>Vol. III · No. 12</span>
                <span className="glyph">✦</span>
                <span>For the open web</span>
                <span className="ln"></span>
              </div>

              <h1>{title}</h1>

              <p className="lede">

                and assisted shopping — so the 1.3 billion people who can't fully use the internet
                today, can.

              <div className="ctas">
                <a className="opt-btn opt-btn-primary">Install in 60 seconds</a>

                <span>SOC 2 Type II</span>
                <span className="sep"></span>
                <span>On-device · zero PII</span>
              </div>
            </div>

            <div className="opt-feat">
              <div className="label">Sample section · features</div>
              <div className="grid">
                <div className="tile">
                  <div className="num">No. 01</div>
                  <h4>Shop with one sentence.</h4>
                  <p>
                    "Find a 65" OLED under $1,500 and check out." Sensa parses any e-commerce site
                    and walks the user through purchase.
                  </p>
                </div>
                <div className="tile">
                  <div className="num">No. 02</div>
                  <h4>Voice navigation</h4>
                  <p>
                    "Open the cart." "Scroll to reviews." Sensa maps spoken intent to your DOM with

              <span className="label">Palette</span>
              {palette.map((p) => (
                <div className="swatch" key={p.hex}>
                  <span className="chip" style={{ background: p.hex }}></span>
                  <span>{p.hex}</span>
                </div>
              ))}
              <span className="font-name">
                <small>Typefaces</small>
                {fonts}

            </div>
